services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexova"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    network_mode: "host"
    environment:
      # ⚠️ JWT_SECRET de respaldo solo para desarrollo local. En producción usa una variable del host.
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-in-production}
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/nexova
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

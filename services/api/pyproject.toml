[project]
name = "nexova-suppliers-api"
version = "0.1.0"
description = "API de gestión de proveedores de Nexova"
requires-python = ">=3.11"
dependencies = [
    "nexova-shared",
    "fastapi>=0.115",
    "libpass[bcrypt]>=1.9.4",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "tinydb>=4.8",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
seed = "routes.seed:main"

[tool.uv.sources]
nexova-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "auth.py",
    "database.py",
    "external_tracker.py",
    "mailer.py",
    "main.py",
    "models.py",
    "profiles.py",
    "record_services.py",
    "routes",
    "security.py",
    "services.py",
    "user_services.py",
    "users.py",
]
